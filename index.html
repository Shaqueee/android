*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:Roboto,'Segoe UI','Segoe UI Emoji','Noto Color Emoji',Arial,sans-serif;user-select:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.rp{position:relative;overflow:hidden}
input,textarea{font-family:inherit;user-select:text}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#phone{width:360px;height:640px;position:relative;overflow:hidden;background:#000;flex:none;transform-origin:center center}
#sb{position:absolute;top:0;left:0;right:0;height:24px;z-index:80;display:flex;align-items:center;padding:0 8px 0 10px;color:#fff;font-size:14px;font-weight:500;pointer-events:none}
#sb .l{flex:1;display:flex;gap:6px;align-items:center}
#sb .r{display:flex;gap:5px;align-items:center}
#sb svg{width:16px;height:16px}
#sb.dark{color:rgba(0,0,0,.6)}
#scr{position:absolute;top:0;left:0;right:0;bottom:48px;overflow:hidden}
#nav{position:absolute;left:0;right:0;bottom:0;height:48px;background:#000;display:flex;justify-content:space-around;align-items:center;z-index:90}
#nav button{width:72px;height:48px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:24px;position:relative;overflow:hidden;color:#fff}
#nav svg{width:22px;height:22px}
.sbsp{height:24px;flex:none}
/* home */
#home{position:absolute;inset:0;background-size:cover;background-position:center;z-index:1}
.gbar{margin:8px 8px 0;height:46px;background:#fff;border-radius:2px;display:flex;align-items:center;padding:0 12px 0 16px;box-shadow:0 1px 3px rgba(0,0,0,.35);cursor:pointer}
.glogo{flex:1;font-size:23px;letter-spacing:-.5px;font-weight:500}
.clock{text-align:center;color:#fff;margin-top:22px;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.clock .ct{font-size:76px;font-weight:200;line-height:1;letter-spacing:-1px}
.clock .cdate{font-size:15px;margin-top:6px;opacity:.95;letter-spacing:.3px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);margin:34px 6px 0;row-gap:14px}
.cell{display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:4px 0}
.cell .lbl{color:#fff;font-size:12px;margin-top:6px;text-shadow:0 1px 3px rgba(0,0,0,.9);max-width:84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.cell:active .ico{transform:scale(.88)}
.ico{width:54px;height:54px;transition:transform .12s;flex:none;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.ico img{width:52px;height:52px;border-radius:11px;display:block}
.ci{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.dock{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:space-around;padding:0 8px}
.dock .cell .lbl{display:none}
.dock-sep{position:absolute;left:16px;right:16px;bottom:82px;height:1px;background:rgba(255,255,255,.25)}
.drawerbtn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;grid-template-columns:repeat(3,6px);gap:5px;place-content:center}
.drawerbtn i{width:6px;height:6px;border-radius:50%;background:#757575;display:block}
/* views */
.view{position:absolute;inset:0;background:#fafafa;display:flex;flex-direction:column;overflow:hidden;z-index:5}
.in-app{animation:appIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes appIn{from{opacity:0;transform:scale(.86)}}
.in-act{animation:actIn .26s cubic-bezier(.2,.8,.2,1)}
@keyframes actIn{from{opacity:0;transform:translateY(48px)}}
.in-fade{animation:fadeIn .35s}
@keyframes fadeIn{from{opacity:0}}
.view.out{animation:viewOut .2s forwards;pointer-events:none}
@keyframes viewOut{to{opacity:0;transform:scale(.94)}}
.tb{height:56px;flex:none;display:flex;align-items:center;padding:0 4px 0 16px;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.24);position:relative;z-index:4}
.tb.wb{padding-left:4px}
.tb .tt{flex:1;font-size:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb.wb .tt{margin-left:20px}
.tb .tav{width:32px;height:32px;border-radius:50%;background-size:cover;background-position:center;margin-left:8px;margin-right:-8px;flex:none}
.ib{width:48px;height:48px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:50%;color:inherit;flex:none;position:relative;overflow:hidden}
.sc{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.sc::-webkit-scrollbar{width:3px}.sc::-webkit-scrollbar-thumb{background:rgba(0,0,0,.25)}
.fab{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;border:0;box-shadow:0 3px 7px rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;z-index:6;overflow:hidden;color:#fff}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.row{display:flex;align-items:center;min-height:72px;padding:0 16px;cursor:pointer;color:#212121;background:#fff}
.row .tx{flex:1;margin-left:16px;min-width:0;padding:12px 0}
.row .t1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:14px;color:#757575;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .tm{font-size:12px;color:#757575;align-self:flex-start;margin-top:16px;margin-left:8px}
.row.unread .t1,.row.unread .t2{font-weight:700;color:#212121}
.row.unread .tm{color:#1E88E5;font-weight:700}
.av{width:40px;height:40px;border-radius:50%;background-size:cover;background-position:center;flex:none;background-color:#ccc}
.letter{width:40px;flex:none;font-size:20px;color:#2196F3;font-weight:500;text-align:left}
.empty{padding:80px 32px;text-align:center;color:#9e9e9e;font-size:15px;line-height:1.5}
.empty svg{width:72px;height:72px;margin-bottom:12px;opacity:.5}
/* chat */
.msgs{background:#fff;padding:8px 0 12px}
.day{text-align:center;font-size:12px;color:#9e9e9e;margin:14px 0 8px;font-weight:500}
.mrow{display:flex;align-items:flex-end;padding:1px 16px 1px 12px}
.mrow .mav{width:36px;height:36px;border-radius:50%;background-size:cover;background-position:center;flex:none;margin-right:8px;visibility:hidden}
.mrow.last .mav{visibility:visible}
.bub{max-width:230px;padding:9px 12px;border-radius:8px;font-size:15px;line-height:1.35;color:#fff;white-space:pre-wrap;word-wrap:break-word;user-select:text}
.mrow.first .bub{border-top-left-radius:8px}
.mrow:not(.last) .bub{border-bottom-left-radius:2px}
.mrow:not(.first) .bub{border-top-left-radius:2px}
.bub.emo{background:none!important;font-size:34px;padding:2px 0;line-height:1.2}
.mtime{font-size:12px;color:#9e9e9e;margin:3px 0 8px 60px}
.mrow.out{justify-content:flex-end;padding:2px 16px}
.mrow.out .bub{background:#f1f1f1;color:#212121;border-bottom-right-radius:2px}
.mst{font-size:12px;color:#9e9e9e;text-align:right;margin:3px 16px 8px}
.mst.fail{color:#e53935;cursor:pointer}
.compose{flex:none;display:flex;align-items:center;background:#fff;border-top:1px solid #e0e0e0;padding:4px 4px 4px 8px;min-height:56px}
.compose input{flex:1;border:0;outline:0;font-size:16px;padding:10px 8px;background:none;color:#212121}
/* contact detail */
.hero{position:relative;height:250px;flex:none;background-size:cover;background-position:center 45%}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,0) 34%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6))}
.hero .htb{position:absolute;top:24px;left:4px;right:4px;display:flex;color:#fff;z-index:2}
.hero .hname{position:absolute;left:72px;bottom:16px;right:16px;color:#fff;font-size:24px;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.drow{display:flex;align-items:center;padding:0 8px 0 24px;min-height:72px;background:#fff;cursor:pointer}
.drow .dtx{flex:1;margin-left:32px}
.drow .d1{font-size:16px;color:#212121}
.drow .d2{font-size:14px;color:#757575;margin-top:2px}
.dsep{height:1px;background:#e0e0e0;margin-left:80px}
/* call */
.call{background:#000;color:#fff}
.call .ctop{padding:22px 24px 18px;position:relative;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.call .via{font-size:13px;opacity:.85}
.call .cname{font-size:32px;font-weight:300;margin-top:8px;line-height:1.15}
.call .cnum{font-size:15px;opacity:.9;margin-top:6px}
.call .cst{font-size:15px;margin-top:12px;font-weight:500;letter-spacing:.3px}
.call .csong{font-size:13px;margin-top:6px;opacity:.9;min-height:16px}
.call .cphoto{flex:1;background-size:cover;background-position:center 55%;position:relative}
.call .cphoto.noph{background:#455A64;display:flex;align-items:center;justify-content:center}
.call .cbtns{position:absolute;left:0;right:0;bottom:96px;display:flex;justify-content:space-around;padding:10px 12px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55));z-index:3}
.call .cbtns button{width:52px;height:52px;border:0;border-radius:50%;background:rgba(0,0,0,.25);color:#fff;display:flex;align-items:center;justify-content:center}
.call .cbtns button.on{background:#fff;color:#212121}
.call .cbot{position:absolute;left:0;right:0;bottom:0;height:96px;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:3}
.call .cend{width:64px;height:64px;border-radius:50%;border:0;background:#F44336;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.4);color:#fff}
.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.45}}
/* phone app */
.phhead{background:#2196F3;flex:none;box-shadow:0 2px 4px rgba(0,0,0,.24);position:relative;z-index:3}
.phsearch{margin:8px 8px 0;height:48px;background:#fff;border-radius:2px;display:flex;align-items:center;padding:0 12px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.phsearch input{flex:1;border:0;outline:0;font-size:16px;margin-left:16px;color:#212121}
.tabs{display:flex;height:48px;position:relative;margin-top:4px}
.tabs button{flex:1;border:0;background:none;color:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center}
.tabs button.on{color:#fff}
.tabs .ind{position:absolute;bottom:0;height:3px;background:#fff;width:33.333%;transition:left .2s}
.tabs.txt button{font-size:14px;font-weight:500;letter-spacing:.3px}
.sd{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px}
.sdt{height:150px;background-size:cover;background-position:center 30%;position:relative;cursor:pointer}
.sdt span{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;color:#fff;font-size:15px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.7))}
.pad{position:absolute;left:0;right:0;bottom:0;background:#fff;z-index:8;box-shadow:0 -2px 8px rgba(0,0,0,.25);transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.pad.open{transform:none}
.pad .pnum{display:flex;align-items:center;height:72px;padding:0 8px 0 56px;border-bottom:1px solid #eee}
.pad .pnum div{flex:1;text-align:center;font-size:30px;color:#212121;font-weight:300;letter-spacing:1px;overflow:hidden;white-space:nowrap}
.keys{display:grid;grid-template-columns:repeat(3,1fr);padding:4px 24px}
.keys button{height:62px;border:0;background:none;border-radius:50%;color:#212121;display:flex;flex-direction:column;align-items:center;justify-content:center}
.keys b{font-size:28px;font-weight:300;line-height:1}
.keys small{font-size:10px;color:#9e9e9e;letter-spacing:1.5px;margin-top:2px;min-height:12px}
.pcall{display:flex;justify-content:center;padding:6px 0 16px}
.pcall button{width:60px;height:60px;border-radius:50%;border:0;background:#43A047;box-shadow:0 3px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;color:#fff}
/* dialog + toast */
.scrim{position:absolute;top:0;left:0;right:0;bottom:48px;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.dlg{width:288px;background:#fff;border-radius:2px;box-shadow:0 12px 32px rgba(0,0,0,.45);padding:24px 0 8px;animation:dlgIn .2s cubic-bezier(.2,.8,.2,1)}
@keyframes dlgIn{from{transform:scale(.9);opacity:0}}
.dlg .dt{font-size:20px;font-weight:500;color:#212121;padding:0 24px;margin-bottom:16px}
.dlg .dm{font-size:16px;color:#757575;padding:0 24px;line-height:1.45;white-space:pre-line}
.dlg .dx{padding:0 24px}
.dlg .db{display:flex;justify-content:flex-end;padding:20px 8px 0;gap:4px}
.dlg .db button{border:0;background:none;color:#009688;font-size:14px;font-weight:500;padding:0 10px;height:36px;min-width:64px;border-radius:2px;letter-spacing:.5px}
.dlg input{width:100%;border:0;border-bottom:2px solid #009688;outline:0;font-size:16px;padding:8px 0;margin-top:12px}
.dlg .prog{height:4px;background:#b2dfdb;margin:18px 24px 0;overflow:hidden}
.dlg .prog i{display:block;height:100%;background:#009688;width:0;transition:width .2s}
#toast{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);background:rgba(70,70,70,.95);color:#fff;font-size:14px;padding:12px 20px;border-radius:24px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;max-width:300px;text-align:center;line-height:1.35}
#toast.show{opacity:1}
/* boot */
#boot{position:absolute;inset:0;background:#000;z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;transition:opacity .5s}
#boot .stage1,#boot .stage2{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .4s}
.pwr{position:absolute;bottom:48px;font-size:13px;color:#bdbdbd;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.dots{display:flex;gap:14px;height:90px;align-items:center}
.dots i{width:22px;height:22px;border-radius:50%;display:block;animation:bounce 1.2s infinite ease-in-out}
.dots i:nth-child(1){background:#4285F4}.dots i:nth-child(2){background:#EA4335;animation-delay:.15s}.dots i:nth-child(3){background:#FBBC05;animation-delay:.3s}.dots i:nth-child(4){background:#34A853;animation-delay:.45s}
@keyframes bounce{0%,60%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-34px) scale(1.12)}}
.andr{font-size:40px;font-weight:300;letter-spacing:1px;margin-top:18px;opacity:0;animation:fadeIn2 1s .8s forwards}
@keyframes fadeIn2{to{opacity:1}}
/* store */
.st-head{background:#689F38;flex:none;position:relative;z-index:3;box-shadow:0 2px 4px rgba(0,0,0,.24)}
.st-search{margin:8px 8px 0;height:48px;background:#fff;border-radius:2px;display:flex;align-items:center;padding:0 12px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.st-search input{flex:1;border:0;outline:0;font-size:17px;margin-left:14px;color:#212121}
.st-search input::placeholder{color:#757575}
.st-body{background:#eee}
.sec{background:#fff;margin:8px 0;padding:14px 0 10px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sec-h{display:flex;align-items:center;padding:0 8px 0 16px;margin-bottom:10px}
.sec-h b{flex:1;font-size:16px;font-weight:500;color:#212121}
.sec-h button{border:0;background:#689F38;color:#fff;font-size:12px;font-weight:500;padding:6px 12px;border-radius:2px}
.hs{display:flex;overflow-x:auto;padding:0 8px;gap:4px}
.hs::-webkit-scrollbar{display:none}
.card{width:104px;flex:none;padding:4px 6px 6px;cursor:pointer;border-radius:2px}
.card .cimg{width:92px;height:92px;border-radius:12px;background-size:cover;display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.card .cn{font-size:13px;color:#212121;margin-top:8px;line-height:1.25;height:33px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .cr{font-size:12px;color:#757575;margin-top:3px}
.lst{background:#fff}
.lrow{display:flex;align-items:center;padding:10px 16px;cursor:pointer;border-bottom:1px solid #eee}
.lrow .lnum{width:22px;color:#757575;font-size:14px;flex:none}
.lrow .limg{width:56px;height:56px;border-radius:10px;background-size:cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:30px}
.lrow .ltx{flex:1;margin-left:14px;min-width:0}
.lrow .l1{font-size:15px;color:#212121;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .l2{font-size:13px;color:#757575;margin-top:2px}
.dt-top{background:#fff;padding:16px;display:flex;gap:16px}
.dt-ic{width:72px;height:72px;border-radius:14px;background-size:cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.dt-name{font-size:20px;color:#212121;line-height:1.25}
.dt-dev{font-size:14px;color:#689F38;font-weight:500;margin-top:4px}
.dt-ads{font-size:12px;color:#757575;margin-top:4px}
.dt-act{background:#fff;padding:0 16px 16px;display:flex;justify-content:flex-end;align-items:center;min-height:56px}
.instbtn{border:0;background:#689F38;color:#fff;font-size:14px;font-weight:500;padding:0 28px;height:38px;border-radius:2px;letter-spacing:.5px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.dlbar{flex:1}
.dlbar .dlt{font-size:12px;color:#757575;margin-bottom:6px}
.dlbar .dlp{height:4px;background:#dcedc8}
.dlbar .dlp i{display:block;height:100%;background:#689F38;width:0}
.stats{display:flex;background:#fff;border-top:1px solid #eee;padding:14px 0}
.stats div{flex:1;text-align:center;font-size:12px;color:#757575}
.stats b{display:block;font-size:16px;color:#212121;font-weight:500;margin-bottom:3px}
.dt-desc{background:#fff;margin-top:8px;padding:16px;font-size:14px;color:#424242;line-height:1.5;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.rev{background:#fff;margin-top:8px;padding:16px 16px 4px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.rev h4{font-size:16px;font-weight:500;color:#212121;margin-bottom:12px}
.rv{display:flex;gap:12px;margin-bottom:16px}
.rv .rva{width:36px;height:36px;border-radius:50%;background-size:cover;background-position:center;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:500}
.rv .rvn{font-size:14px;color:#212121;font-weight:500}
.rv .rvs{font-size:12px;color:#689F38;letter-spacing:1px}
.rv .rvt{font-size:14px;color:#616161;margin-top:2px;line-height:1.4}
/* gallery */
.gal{background:#212121}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.ggrid div{aspect-ratio:1;background-size:cover;background-position:center;cursor:pointer;background-color:#333}
.viewer{background:#000}
.viewer .vimg{flex:1;background-size:contain;background-repeat:no-repeat;background-position:center}
.viewer .vtb{position:absolute;top:24px;left:0;right:0;display:flex;padding:0 4px;color:#fff;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,0));z-index:3}
.viewer .vtb .tt{flex:1;align-self:center;font-size:16px;margin-left:12px}
/* notes */
.notes{background:#f5f5f5}
.ncols{column-count:2;column-gap:8px;padding:8px}
.nc{break-inside:avoid;background:#fff;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.2);padding:12px 14px;margin-bottom:8px;cursor:pointer;color:#212121}
.nc .nt{font-size:15px;font-weight:500;margin-bottom:6px;word-wrap:break-word}
.nc .nb{font-size:13px;color:#424242;white-space:pre-wrap;line-height:1.4;max-height:190px;overflow:hidden;word-wrap:break-word}
.ned{flex:1;display:flex;flex-direction:column;padding:8px 16px}
.ned input{border:0;outline:0;background:none;font-size:20px;color:#212121;padding:12px 0;font-weight:500}
.ned textarea{flex:1;border:0;outline:0;background:none;font-size:16px;color:#212121;resize:none;line-height:1.5}
/* deadlock splash */
.dls{flex:1;background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:#efe6d4}
.dls::before{content:'';position:absolute;inset:0;background:rgba(10,8,6,.7)}
.dls>*{position:relative}
.dls img{width:120px;height:120px}
.dls .t1{font-size:30px;letter-spacing:8px;margin-top:18px;font-weight:500}
.dls .t2{font-size:14px;margin-top:10px;opacity:.85}
.spin{width:36px;height:36px;border:3px solid rgba(239,230,212,.25);border-top-color:#efe6d4;border-radius:50%;animation:spin 1s linear infinite;margin-top:26px}
@keyframes spin{to{transform:rotate(360deg)}}
/* recents + drawer */
.recents{background:rgba(20,20,20,.92)}
.rcard{margin:10px 16px;background:#fafafa;border-radius:2px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.5);cursor:pointer}
.rcard .rh{height:48px;display:flex;align-items:center;padding:0 4px 0 12px;color:#fff;font-size:15px}
.rcard .rh .ico{width:28px;height:28px;filter:none;margin-right:12px}
.rcard .rh .ico img,.rcard .rh .ci{width:28px;height:28px;border-radius:50%}
.rcard .rh .ci svg{width:16px;height:16px}
.rcard .rh span{flex:1}
.rcard .rb{height:110px;background:#f5f5f5}
.clearall{display:block;margin:12px auto 18px;border:0;background:none;color:#fff;font-size:14px;font-weight:500;letter-spacing:.5px;padding:10px 16px}
.drawer{background:#fafafa}

const scr = () => $('#scr');

function push(html, { sb = '#000', app = null, anim = 'app', cls = '', onclose = null, back = null } = {}) {
  const v = document.createElement('div');
  v.className = 'view ' + cls + ' in-' + anim;
  v.innerHTML = (sb ? `<div class="sbsp" style="background:${sb}"></div>` : '') + html;
  scr().appendChild(v);
  v.addEventListener('animationend', () => v.classList.remove('in-' + anim), { once: true });
  const o = { el: v, app, onclose, back };
  stack.push(o);
  if (app) { const i = recents.indexOf(app); if (i >= 0) recents.splice(i, 1); recents.unshift(app); }
  updateSb();
  return v;
}
function pop() {
  const o = stack.pop(); if (!o) return;
  try { o.onclose && o.onclose(); } catch (e) {}
  o.el.classList.add('out'); setTimeout(() => o.el.remove(), 220);
  updateSb();
}
function back() {
  if (closeDialog()) return;
  const top = stack[stack.length - 1];
  if (top && top.back && top.back()) return;
  pop();
}
function goHome() { closeDialog(); while (stack.length) pop(); }

      const mel = [['E5', 0], ['B5', .16], ['Gs5', .32], ['E6', .48], ['Cs6', .8], ['B5', .96], ['Gs5', 1.12], ['B5', 1.28], ['E5', 1.6], ['Fs5', 1.76], ['Gs5', 1.92], ['B4', 2.08]];

  const save = () => {
    if (deleted) return;
    const n = getNotes(); const i = n.findIndex(x => x.id === id); if (i < 0) return;
    n[i].title = $('input', v).value; n[i].body = $('textarea', v).value;
    if (!n[i].title.trim() && !n[i].body.trim()) n.splice(i, 1);
    saveNotes(n); onBack && onBack();
  };
  const v = push(`<div class="tb wb" style="background:${col};color:#424242;box-shadow:none"><button class="ib rp" data-a="back">${I('arrow_back', 'currentColor')}</button><div class="tt"></div><button class="ib rp" data-a="del">${I('delete', 'currentColor')}</button></div><div class="ned" style="background:${col}"><input placeholder="Заголовок" value="${esc(note.title)}"><textarea placeholder="Заметка">${esc(note.body)}</textarea></div>`, { sb: shade(col === '#fff' ? '#bdbdbd' : col, .7), app: 'notes', anim: 'act', onclose: save });
  $$('input,textarea', v).forEach(el => el.addEventListener('keydown', e => e.stopPropagation()));
  if (isNew) setTimeout(() => $('textarea', v).focus(), 300);
  v.addEventListener('click', e => {
    const t = e.target.closest('[data-a]'); if (!t) return;
    if (t.dataset.a === 'back') back();
    else if (t.dataset.a === 'del') { deleted = true; const n = getNotes().filter(x => x.id !== id); saveNotes(n); onBack && onBack(); back(); toast('Заметка удалена'); }
  });
}

/* ---------- gallery ---------- */
const DB = {
  db: null,
  open() { if (this.db) return Promise.resolve(this.db); return new Promise((res, rej) => { const r = indexedDB.open('droid7', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id', autoIncrement: true }); r.onsuccess = () => res(this.db = r.result); r.onerror = () => rej(r.error); }); },
  async tx(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('photos', mode); const s = t.objectStore('photos'); const r = fn(s); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); },
  all() { return this.tx('readonly', s => s.getAll()); },
  add(blob) { return this.tx('readwrite', s => s.add({ blob, ts: Date.now() })); },
  del(id) { return this.tx('readwrite', s => s.delete(id)); },
};
let galUrls = [];
function openGallery() {
  const v = push(`<div class="tb" style="background:#424242"><div class="tt">Галерея</div><button class="ib rp" data-a="add">${I('add', '#fff')}</button><button class="ib rp" data-a="more">${I('more_vert', '#fff')}</button></div><div class="sc gal"><div data-list></div></div><input type="file" accept="image/*" multiple hidden>`, { sb: '#212121', app: 'gallery', onclose: () => { galUrls.forEach(u => URL.revokeObjectURL(u.url)); galUrls = []; } });
  const list = $('[data-list]', v), file = $('input[type=file]', v);
  const render = async () => {
    let items = [];
    try { items = await DB.all(); } catch (e) {}
    galUrls.forEach(u => URL.revokeObjectURL(u.url));
    galUrls = items.sort((a, b) => b.ts - a.ts).map(x => ({ id: x.id, url: URL.createObjectURL(x.blob) }));
    list.innerHTML = galUrls.length ? `<div class="ggrid">${galUrls.map((u, i) => `<div data-i="${i}" style="background-image:url(${u.url})"></div>`).join('')}</div>` : `<div class="empty" style="color:#9e9e9e">${I('collections', '#9e9e9e')}<br>Нет фотографий<br><span style="font-size:13px">Нажмите «+», чтобы добавить фото с компьютера</span></div>`;
  };
  render();
  file.addEventListener('change', async () => { for (const f of file.files) { try { await DB.add(f); } catch (e) { toast('Не удалось сохранить фото'); } } file.value = ''; render(); });
  v.addEventListener('click', e => {
    const c = e.target.closest('[data-i]'); if (c) return openViewer(+c.dataset.i, render);
    const t = e.target.closest('[data-a]'); if (!t) return;
    if (t.dataset.a === 'add') file.click(); else toast('Недоступно');
  });
}
function openViewer(i, onChange) {
  const v = push(`<div class="vtb"><button class="ib rp" data-a="back">${I('arrow_back', '#fff')}</button><div class="tt"></div><button class="ib rp" data-a="del">${I('delete', '#fff')}</button></div><div class="vimg"></div>`, { sb: '#000', cls: 'viewer', anim: 'fade', back: null });
  const show = () => { if (!galUrls[i]) return; $('.vimg', v).style.backgroundImage = `url(${galUrls[i].url})`; $('.vtb .tt', v).textContent = (i + 1) + ' из ' + galUrls.length; };
  show();
  v._key = e => { if (e.key === 'ArrowLeft' && i > 0) { i--; show(); } if (e.key === 'ArrowRight' && i < galUrls.length - 1) { i++; show(); } };
  v.addEventListener('click', e => {
    const t = e.target.closest('[data-a]');
    if (t && t.dataset.a === 'back') return back();
    if (t && t.dataset.a === 'del') { dialog({ msg: 'Удалить это фото?', buttons: [['ОТМЕНА'], ['УДАЛИТЬ', () => { DB.del(galUrls[i].id).then(() => { back(); onChange(); }); }]] }); return; }
    const r = v.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width;
    if (x < .35 && i > 0) { i--; show(); } else if (x > .65 && i < galUrls.length - 1) { i++; show(); }
  });
}

/* ---------- play market ---------- */
const stars = r => '★'.repeat(Math.round(r)) + '☆'.repeat(5 - Math.round(r));
const cardHtml = a => `<div class="card rp" data-app-id="${a.id}"><div class="cimg" style="${appImg(a)}">${appEmo(a)}</div><div class="cn">${esc(a.name)}</div><div class="cr">${rate(a.r)} ★</div></div>`;
const lrowHtml = (a, n) => `<div class="lrow rp" data-app-id="${a.id}">${n ? `<div class="lnum">${n}</div>` : ''}<div class="limg" style="${appImg(a)}">${appEmo(a)}</div><div class="ltx"><div class="l1">${esc(a.name)}</div><div class="l2">${esc(a.dev)}</div><div class="l2">${rate(a.r)} ★ · ${a.size}</div></div></div>`;
function openMarket() {
  let tab = 0;
  const v = push(`<div class="st-head"><div class="st-search">${I('search', '#757575')}<input placeholder="Google Play"><span data-a="mic">${I('mic', '#757575')}</span></div><div class="tabs txt"><button class="on" data-t="0">ГЛАВНАЯ</button><button data-t="1">ТОП</button><button data-t="2">АНИМЕ</button><div class="ind" style="left:0"></div></div></div><div class="sc st-body" data-body></div>`, { sb: '#558B2F', app: 'market' });
  const body = $('[data-body]', v), inp = $('.st-search input', v);
  const render = () => {
    $$('.tabs button', v).forEach(b => b.classList.toggle('on', +b.dataset.t === tab));
    $('.tabs .ind', v).style.left = (tab * 33.333) + '%';
    const q = inp.value.trim().toLowerCase();
    if (q) { const r = STORE.filter(a => (a.name + ' ' + a.dev).toLowerCase().includes(q)); body.innerHTML = `<div class="lst">${r.length ? r.map(a => lrowHtml(a)).join('') : '<div class="empty">Ничего не найдено</div>'}</div>`; return; }
    if (tab === 0) body.innerHTML = SECTIONS.map(([t, ids], si) => `<div class="sec"><div class="sec-h"><b>${t}</b><button class="rp" data-more="${si}">ЕЩЁ</button></div><div class="hs">${ids.map(id => cardHtml(storeById(id))).join('')}</div></div>`).join('') + '<div style="height:8px"></div>';
    else if (tab === 1) body.innerHTML = `<div class="lst">${[...STORE].sort((a, b) => parseInt(b.n.replace(/\s/g, '')) - parseInt(a.n.replace(/\s/g, ''))).map((a, i) => lrowHtml(a, i + 1)).join('')}</div>`;
    else body.innerHTML = `<div class="lst">${STORE.filter(a => a.id[0] === 'a').map(a => lrowHtml(a)).join('')}</div>`;
    body.scrollTop = 0;
  };
  render();
  inp.addEventListener('input', render);
  inp.addEventListener('keydown', e => e.stopPropagation());
  v.addEventListener('click', e => {
    const tb = e.target.closest('[data-t]'); if (tb) { tab = +tb.dataset.t; inp.value = ''; render(); return; }
    const mo = e.target.closest('[data-more]'); if (mo) { const [t, ids] = SECTIONS[+mo.dataset.more]; openStoreList(t, ids); return; }
    const c = e.target.closest('[data-app-id]'); if (c) return openStoreApp(c.dataset.appId);
    if (e.target.closest('[data-a="mic"]')) toast('Говорите…');
  });
}
function openStoreList(title, ids) {
  const v = push(`<div class="tb wb" style="background:#689F38"><button class="ib rp" data-a="back">${I('arrow_back', '#fff')}</button><div class="tt">${title}</div></div><div class="sc st-body"><div class="lst">${ids.map(id => lrowHtml(storeById(id))).join('')}</div></div>`, { sb: '#558B2F', app: 'market', anim: 'act' });
  v.addEventListener('click', e => { if (e.target.closest('[data-a="back"]')) return back(); const c = e.target.closest('[data-app-id]'); if (c) openStoreApp(c.dataset.appId); });
}
function openStoreApp(id) {
  const a = storeById(id);
  let busy = false;
  const v = push(`<div class="tb wb" style="background:#689F38"><button class="ib rp" data-a="back">${I('arrow_back', '#fff')}</button><div class="tt"></div><button class="ib rp" data-a="search">${I('search', '#fff')}</button></div>
  <div class="sc st-body">
    <div class="dt-top"><div class="dt-ic" style="${appImg(a)}">${appEmo(a)}</div><div><div class="dt-name">${esc(a.name)}</div><div class="dt-dev">${esc(a.dev)}</div><div class="dt-ads">Содержит рекламу · Покупки в приложении</div></div></div>
    <div class="dt-act" data-act><button class="instbtn rp" data-a="install">УСТАНОВИТЬ</button></div>
    <div class="stats"><div><b>${a.dl}</b>Скачивания</div><div><b>${rate(a.r)} ★</b>${a.n} отз.</div><div><b>${a.age}</b>PEGI</div><div><b>${a.size}</b>Размер</div></div>
    <div class="dt-desc"><div style="font-weight:500;color:#212121;margin-bottom:6px">${esc(a.cat)}</div><div style="white-space:pre-line">${esc(a.desc)}</div></div>
    <div class="rev"><h4>Оценки и отзывы</h4>${a.rev.map(([pid, r, t]) => { const p = PEOPLE[pid]; return `<div class="rv"><div class="rva" style="background-image:url(${p.av})"></div><div><div class="rvn">${esc(p.name)}</div><div class="rvs">${stars(r)}</div><div class="rvt">${esc(t)}</div></div></div>`; }).join('')}</div>
    <div style="height:16px"></div>
  </div>`, { sb: '#558B2F', app: 'market', anim: 'act', onclose: () => { busy = false; } });
  const act = $('[data-act]', v);
  const reset = () => { act.innerHTML = `<button class="instbtn rp" data-a="install">УСТАНОВИТЬ</button>`; };
  v.addEventListener('click', e => {
    const t = e.target.closest('[data-a]'); if (!t) return;
    if (t.dataset.a === 'back') back();
    else if (t.dataset.a === 'search') { back(); }
    else if (t.dataset.a === 'cancel') { busy = false; reset(); }
    else if (t.dataset.a === 'install' && !busy) {
      busy = true; let p = 0;
      act.innerHTML = `<div class="dlbar"><div class="dlt">Загрузка… <span>0%</span></div><div class="dlp"><i></i></div></div><button class="ib rp" data-a="cancel" style="color:#757575">${I('close', 'currentColor')}</button>`;
      const span = $('span', act), bar = $('.dlp i', act);
      const step = () => {
        if (!busy || !v.isConnected) return;
        p += 3 + Math.random() * 9;
        if (p >= 100) { span.textContent = '100%'; bar.style.width = '100%'; $('.dlt', act).textContent = 'Установка…'; setTimeout(() => { if (!busy) return; busy = false; reset(); dialog({ title: 'Недостаточно памяти', msg: 'Освободите место' }); }, 700); return; }
        span.textContent = Math.floor(p) + '%'; bar.style.width = p + '%'; setTimeout(step, 120);
      };
      setTimeout(step, 400);
    }
  });
}

/* ---------- boot ---------- */
function boot() {
  const b = $('#boot');
  b.innerHTML = `<div class="stage1">${bugdroid('#A4C639')}<div style="font-size:34px;font-weight:300;margin-top:14px;letter-spacing:1px">android</div><div class="pwr">Powered by android</div></div><div class="stage2" style="opacity:0"><div class="dots"><i></i><i></i><i></i><i></i></div><div class="andr">android</div></div>`;
  const s1 = $('.stage1', b), s2 = $('.stage2', b);
  setTimeout(() => { s1.style.opacity = 0; s2.style.opacity = 1; }, 1800);
  setTimeout(() => {
    s2.style.opacity = 0;
    setTimeout(() => {
      b.innerHTML = `<div class="dlg" style="width:280px"><div class="dt">Android запускается…</div><div class="dm" data-o>Оптимизация приложения 1 из 13.</div><div class="prog"><i></i></div><div style="height:16px"></div></div>`;
      b.style.background = '#000';
      let k = 1; const bar = $('.prog i', b), o = $('[data-o]', b);
      const it = setInterval(() => { k++; if (k > 13) { clearInterval(it); finish(); return; } o.textContent = `Оптимизация приложения ${k} из 13.`; bar.style.width = (k / 13 * 100) + '%'; }, 140);
    }, 450);
  }, 6000);
  const finish = () => { b.style.opacity = 0; setTimeout(() => b.remove(), 520); };
}

/* ---------- init ---------- */
function fit() { const s = Math.min(innerWidth / 360, innerHeight / 640); $('#phone').style.transform = `scale(${s})`; }
function init() {
  document.title = 'Android';
  $('#sb .r').innerHTML = `${I('signal_wifi_4_bar', '#fff', 16)}${I('signal_cellular_4_bar', '#fff', 16)}${I('battery_full', '#fff', 16)}<span style="margin-left:2px">${CLOCK}</span>`;
  $('#nav').innerHTML = `<button class="rp" data-n="back"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M17 4L6 12l11 8z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></button><button class="rp" data-n="home"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="8" fill="none" stroke="#fff" stroke-width="2"/></svg></button><button class="rp" data-n="rec"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="5" y="5" width="14" height="14" rx="1" fill="none" stroke="#fff" stroke-width="2"/></svg></button>`;
  $('#nav').addEventListener('click', e => { const b = e.target.closest('[data-n]'); if (!b) return; const n = b.dataset.n; if (n === 'back') back(); else if (n === 'home') goHome(); else { closeDialog(); openRecents(); } });
  renderHome(); updateSb();
  $('#scr').addEventListener('click', e => {
    const c = e.target.closest('[data-app]');
    if (c && !e.target.closest('.recents')) { const inDrawer = e.target.closest('.drawer'); if (inDrawer) pop(); setTimeout(() => launch(c.dataset.app), inDrawer ? 120 : 60); return; }
    const a = e.target.closest('[data-act]');
    if (a && a.closest('#home')) { if (a.dataset.act === 'drawer') openDrawer(); else if (a.dataset.act === 'google') noMem(); }
  });
  document.addEventListener('pointerdown', e => {
    const t = e.target.closest('.rp'); if (!t) return;
    const r = t.getBoundingClientRect(); const k = (r.width / t.offsetWidth) || 1;
    const x = (e.clientX - r.left) / k, y = (e.clientY - r.top) / k; const d = Math.max(t.offsetWidth, t.offsetHeight) * 2.2;
    const s = document.createElement('span'); s.className = 'ripple'; s.style.cssText = `width:${d}px;height:${d}px;left:${x - d / 2}px;top:${y - d / 2}px`;
    t.appendChild(s); setTimeout(() => s.remove(), 600);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' || (e.key === 'Backspace' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName))) { e.preventDefault(); back(); }
    const tv = topView(); if (tv && tv._key) tv._key(e);
  });
  document.addEventListener('contextmenu', e => { if (!/INPUT|TEXTAREA/.test(e.target.tagName)) e.preventDefault(); });
  addEventListener('resize', fit); fit();
  if (MODE === 'server') {
    const ping = () => fetch('/api/ping', { cache: 'no-store' }).catch(() => {});
    ping(); setInterval(ping, 10000);
    addEventListener('pagehide', () => { try { navigator.sendBeacon('/api/bye'); } catch (e) {} });
  }
  boot();
}
document.addEventListener('DOMContentLoaded', init);
</script></body></html>
